<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="에이투 콘텐츠 채널 성과 대시보드" />
  <title>ATWO Content Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="대시보드 홈">
        <span class="brand-mark">A2</span>
        <span>Content Pulse</span>
      </a>
      <div class="sync-state"><span class="pulse"></span><span id="syncText">데이터 연결 중</span></div>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">CONTENT PERFORMANCE</p>
          <h1>콘텐츠 성과를<br><em>한눈에.</em></h1>
          <p class="hero-copy">채널별 콘텐츠 발행 현황과 누적 조회 성과를<br class="desktop-only"> 업로드 날짜 기준으로 빠르게 확인하세요.</p>
        </div>
        <div class="filter-card" aria-label="조회 기간 설정">
          <div class="filter-heading">
            <span>조회 기간</span>
            <button id="resetButton" class="text-button" type="button">전체 기간</button>
          </div>
          <div class="date-row">
            <label><span>시작일</span><input id="startDate" type="date" /></label>
            <span class="date-arrow">→</span>
            <label><span>종료일</span><input id="endDate" type="date" /></label>
          </div>
          <div class="quick-row">
            <button type="button" data-range="7">최근 7일</button>
            <button type="button" data-range="30">최근 30일</button>
            <button type="button" data-range="month">이번 달</button>
          </div>
        </div>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <div><p class="eyebrow">OVERVIEW</p><h2>채널별 핵심 KPI</h2></div>
          <p id="periodLabel" class="section-note">전체 업로드 기간</p>
        </div>
        <div id="kpiGrid" class="kpi-grid" aria-live="polite"></div>
      </section>

      <section class="section-block content-section">
        <div class="section-heading">
          <div><p class="eyebrow">CONTENT LOG</p><h2>시트별 작업 내역</h2></div>
          <p id="resultCount" class="section-note"></p>
        </div>
        <div id="tabs" class="tabs" role="tablist" aria-label="콘텐츠 채널"></div>
        <div class="table-wrap">
          <table>
            <thead><tr id="contentHead"></tr></thead>
            <tbody id="contentRows"></tbody>
          </table>
          <div id="emptyState" class="empty-state" hidden><span>∅</span><strong>해당 기간의 콘텐츠가 없습니다</strong><p>조회 기간을 변경해 다시 확인해 주세요.</p></div>
        </div>
      </section>
    </main>

    <footer><span>ATWO CONTENT TEAM</span><span>Google Sheets 연동 대시보드</span></footer>
  </div>
  <script src="app.js?v=2"></script>
</body>
</html>
